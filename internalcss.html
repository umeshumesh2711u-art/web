<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            color: aqua;
            text-align: center;
            font-size: 40px;
        }
        h2{
            color: red;
            text-decoration: underline;
            text-align: end  ;
        }
        p{
            color: blue;
            font-size: 20px;
            line-height: 1.5;
            background-color: chartreuse;
        }
        button{
            background-color: blueviolet;
            color: brown;
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }
        table{
            color: rgb(119, 58, 58);
        }
        td{
            background-color: chartreuse;
            padding: 10px;
            text-align: center;
        }
        th{
            color: gold;
            border-color: blueviolet;
            font-size: 20px;
        }
        mark{
            background-color: crimson;
        }
        img{
            width: 200px;
            border: 5px solid black;
            border-radius: 10px;
        }
        a{
            color: red;
            text-decoration: none;
            font-size: 10px;
        }
        ul{
            color: darkgoldenrod;
            font-size: 20px;
        }
        li{
            background-color: blue;
            text-align: center;
            margin: 8px;
        }
        hr{border: 2px solid blue;}
       
        
</style>
</head>

</html>
